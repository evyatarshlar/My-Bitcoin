<section (click)="onSelect.emit(contact._id)" class="contact-preview">
  <img src="https://robohash.org/{{ contact._id }}?set=set1" alt="contact" />
  <a [routerLink]="['/contact', contact._id]" class="info">
    <p>Name: {{ contact.name }}</p>
    <p>Phone: {{ contact.phone }}</p>
  </a>
  <section class="actions">
    <button (click)="remove.emit(contact._id)" class="remove-btn">X</button>
    <a [routerLink]="['/contact/edit', contact._id]">Edit</a>
  </section>
</section>

<router-outlet></router-outlet>
