<ngx-charts-bar-vertical
	[results]="trades$ | async"
	[xAxisLabel]="'USD Exchange Trade Volume'"
	[legendTitle]="'Day'"
	[yAxisLabel]="'Trade Volume (USD)'"
	[legend]="true"
	[showXAxisLabel]="true"
	[showYAxisLabel]="true"
	[xAxis]="true"
	[yAxis]="true"
	[gradient]="true"
>
</ngx-charts-bar-vertical>

<ngx-charts-pie-chart
	[results]="saleData"
	[legend]="false"
	[legendTitle]="'Product Sale Report'"
	[labels]="true"
>
</ngx-charts-pie-chart>
